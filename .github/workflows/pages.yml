name: Build and deploy site

# The site in docs/ used to be committed; it is now generated from the markdown
# sources on every push by tools/build_site.py and deployed straight to Pages.
on:
  push:
    branches: [main]
    paths:
      - 'claude/**'
      - 'plans/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish deploying rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # build_site.py is standard-library only, so there is nothing to install.
      # It exits non-zero on any warning (missing diagram, stale substitution),
      # which fails the build rather than quietly publishing a broken page.
      - name: Build site
        run: python3 tools/build_site.py _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

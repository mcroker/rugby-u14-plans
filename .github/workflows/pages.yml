name: Build and deploy site

# The site used to be committed as HTML; it is now generated from the markdown
# sources on every push by tools/build_site.ts and deployed straight to Pages.
on:
  push:
    branches: [main]
    paths:
      - 'claude/**'
      - 'plans/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

  # next.html always shows the upcoming session, so the site has to rebuild as
  # time passes, not only when something is pushed. Daily at 05:00 UTC.
  # Note: GitHub disables scheduled workflows after 60 days with no repo
  # activity — re-enable from the Actions tab if that ever happens.
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish deploying rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 runs TypeScript directly (type stripping), so the build itself
      # needs no dependencies and no compile step.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # TypeScript is a dev dependency for the type-check only — stripping types
      # at runtime does not check them.
      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # build_site.ts exits non-zero on any warning (missing diagram, stale
      # substitution), failing the build rather than publishing a broken page.
      - name: Build site
        run: node tools/build_site.ts _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"
     aria-label="Example club grounds: four pitches and a floodlit training area">
  <!-- A placeholder allocation map, so the example team's pitch pin has
       something to sit on. Replace it with your club's own map image and update
       the percentages in club/pitch-zones.json to match. -->
  <rect width="800" height="560" fill="#e8efe4"/>

  <g fill="none" stroke="#7fa06a" stroke-width="3">
    <!-- Pitch 4, top left -->
    <rect x="40" y="20" width="220" height="130"/>
    <!-- Training area, floodlit -->
    <rect x="60" y="185" width="150" height="105" fill="#cfe0ee" stroke="#6b93b8"/>
    <!-- Pitch 1, bottom left -->
    <rect x="40" y="350" width="260" height="150"/>
    <!-- Pitch 2, right -->
    <rect x="330" y="230" width="250" height="150"/>
    <!-- Pitch 3, top right -->
    <rect x="480" y="40" width="250" height="150"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="17" fill="#3d5230">
    <text x="150" y="90" text-anchor="middle">Pitch 4</text>
    <text x="135" y="243" text-anchor="middle" fill="#2c4a63">Training Area</text>
    <text x="170" y="430" text-anchor="middle">Pitch 1</text>
    <text x="455" y="310" text-anchor="middle">Pitch 2</text>
    <text x="605" y="120" text-anchor="middle">Pitch 3</text>
  </g>

  <!-- Clubhouse, bottom-left, the point the half-pitch names are read from -->
  <rect x="30" y="512" width="130" height="34" rx="4" fill="#8a6d3b"/>
  <text x="95" y="535" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="15" fill="#fff">Club House</text>

  <text x="770" y="545" text-anchor="end" font-family="system-ui, sans-serif"
        font-size="13" fill="#6f7f63">Example map — replace with your club's</text>
</svg>

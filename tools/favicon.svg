    <path d="M20 32 H44" stroke="#e0b45c" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M25 25.5 V38.5 M32 24.5 V39.5 M39 25.5 V38.5"
          stroke="#e0b45c" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
